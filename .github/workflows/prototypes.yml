name: Test Swift prototypes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speaker-status:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Show compiler
        run: swift --version
      - name: Build and test with synthetic data only
        run: swift test --package-path prototypes/speaker-status
      - name: Check command help without credentials or network access
        run: |
          swift run --package-path prototypes/speaker-status upnp-status --help
          swift run --package-path prototypes/speaker-status cloud-status --help
